name: compux-platform

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: abanuraj223/compux-engine:latest
    container_name: compux-engine
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - API_KEY=${API_KEY:-anurag123}
      - BASE_WEBHOOK_URL=http://frontend:3001/api/whatsapp/webhook
      - ENABLE_WEBHOOK=TRUE
      - AUTO_START_SESSIONS=TRUE
      - HEADLESS=TRUE
      - SET_MESSAGES_AS_SEEN=TRUE
    volumes:
      - ./sessions:/usr/src/app/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - compux-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: abanuraj223/compux-frontend:latest
    container_name: compux-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - APP_URL=${APP_URL:-http://localhost:3001}
      - WHATSAPP_ENGINE_URL=http://engine:3000
      - API_KEY=${API_KEY:-anurag123}
      - JWT_SECRET=${JWT_SECRET:-compux-super-secret-jwt-key}
      - DATABASE_URL=file:/app/data/local.db
      - UPLOAD_PATH=/app/uploads
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - AI_API_KEY=${AI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - engine
    networks:
      - compux-network

networks:
  compux-network:
    driver: bridge
